# Server configuration
server.port=3001
# Bind on all network interfaces for containerized environments
server.address=0.0.0.0

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Datasource: default to in-memory H2 for local/dev so the app can boot without external DB.
# To use MySQL, set SPRING_DATASOURCE_URL/USERNAME/PASSWORD environment variables
# or override the properties below via --spring.datasource.* arguments.
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:crm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# H2 console (optional) at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false
